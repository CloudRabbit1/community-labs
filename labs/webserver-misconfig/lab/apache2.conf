ServerName localhost

<VirtualHost *:80>
    DocumentRoot /var/www/html
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined

    # Main directory: no listing
    <Directory /var/www/html>
        Options -Indexes -FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Misconfigured backup directory: directory listing enabled
    <Directory /var/www/html/backup>
        Options +Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # CGI execution
    ScriptAlias /cgi-bin/ /usr/lib/cgi-bin/
    <Directory /usr/lib/cgi-bin/>
        Options +ExecCGI
        AddHandler cgi-script .sh
        Require all granted
    </Directory>
</VirtualHost>
